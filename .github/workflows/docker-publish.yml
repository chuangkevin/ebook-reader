name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose*.yml'
      - '.github/workflows/*.yml'
      - 'scripts/deploy.py'
      - 'tests/deployment/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Test deployment recovery
        run: python3 -m unittest discover -s tests/deployment -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/readflix-frontend:sha-${{ github.sha }}
            ${{ env.DOCKERHUB_USERNAME }}/readflix-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build and push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/readflix-backend:sha-${{ github.sha }}
            ${{ env.DOCKERHUB_USERNAME }}/readflix-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          {
            echo '## Docker Images Published'
            echo "- Frontend: $DOCKERHUB_USERNAME/readflix-frontend:sha-$GITHUB_SHA"
            echo "- Backend: $DOCKERHUB_USERNAME/readflix-backend:sha-$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
