name: Deploy to Server via Tailscale

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readflix-production
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout the published commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Test deployment recovery
        run: python3 -m unittest discover -s tests/deployment -v

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Setup SSH
        env:
          DEPLOY_SERVER_IP: ${{ secrets.DEPLOY_SERVER_IP }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_SERVER_IP" >> ~/.ssh/known_hosts

      - name: Stage and deploy the published image pair
        env:
          DEPLOY_SERVER_IP: ${{ secrets.DEPLOY_SERVER_IP }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Quote remote arguments for the SSH shell; never interpolate secrets as code.
          remote_stage=$(python3 - <<'PY'
          import os, shlex
          from pathlib import PurePosixPath
          root = PurePosixPath(os.environ['DEPLOY_PATH'])
          if not root.is_absolute() or str(root) == '/':
              raise SystemExit('DEPLOY_PATH must be an existing absolute application directory')
          stage = root / ('.readflix-stage-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          print(shlex.join(['mkdir', '-m', '700', '--', str(stage)]))
          PY
          )
          target="${DEPLOY_USER}@${DEPLOY_SERVER_IP}"
          ssh_options=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          # The commands are deliberately assembled locally with shlex.join.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$target" "$remote_stage"
          # Transfer only public release files, never server data or credentials.
          remote_unpack=$(python3 - <<'PY'
          import os, shlex
          from pathlib import PurePosixPath
          stage = PurePosixPath(os.environ['DEPLOY_PATH']) / ('.readflix-stage-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          print(shlex.join(['tar', '-xf', '-', '-C', str(stage)]))
          PY
          )
          # shellcheck disable=SC2029
          tar -cf - scripts/deploy.py docker-compose.prod.yml | ssh "${ssh_options[@]}" "$target" "$remote_unpack"
          remote_deploy=$(python3 - <<'PY'
          import os, shlex
          from pathlib import PurePosixPath
          root = PurePosixPath(os.environ['DEPLOY_PATH'])
          stage = root / ('.readflix-stage-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          print(shlex.join(['python3', str(stage / 'scripts/deploy.py'), '--path', str(root),
                            '--compose', str(stage / 'docker-compose.prod.yml'), '--sha', os.environ['RELEASE_SHA']]))
          PY
          )
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$target" "$remote_deploy"

      - name: Deployment Summary
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          {
            echo '## Deployment Summary'
            echo "- Status: $DEPLOY_STATUS"
            echo "- Release commit: $RELEASE_SHA"
            echo '- Success requires a verified server-local data backup and both service health checks.'
            echo '- Recovery archives, Compose snapshots and image receipts remain on the server.'
          } >> "$GITHUB_STEP_SUMMARY"
